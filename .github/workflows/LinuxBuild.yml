name: Linux Build
# Builds the linux_amd64 binary the tests load. Called by CI.yml; dispatch it alone for a quick build, then
# test that run's artifact with Integration Test (run_id).
on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build (linux_amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # DuckDB itself is most of the build; ccache keeps its objects between runs so a change to the
      # extension only recompiles the extension
      - run: sudo apt-get update && sudo apt-get install -y ninja-build

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-amd64-duckdb-f8f3f4dcd9
          max-size: 2G

      - name: Build extension
        run: make release
        env:
          GEN: ninja
          # The submodule checkout has no tags, so DuckDB would stamp the raw commit hash; the test wheel reports
          # this version and only loads extensions stamped with it
          OVERRIDE_GIT_DESCRIBE: v2.0.0-alpha48730
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache

      - uses: actions/upload-artifact@v4
        with:
          name: delta_export-linux_amd64
          path: build/release/extension/delta_export/delta_export.duckdb_extension
