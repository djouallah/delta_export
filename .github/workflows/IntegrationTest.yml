name: Integration Test
# Called by CI.yml with this run's build (every test; OneLake only on pushes to main, never with fork code).
# Dispatch it to rerun tests against the build of run_id, or else the latest CI build on main. Dispatched
# runs keep pytest's last-failed cache: they re-run only the tests that failed in the previous run of that
# job (nothing when nothing failed). full=true runs everything, only=<job> one job, tests=<pytest -k
# expression> chosen tests.
on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true
      fuzz_seeds:
        type: string
        default: '30'
      onelake:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      only:
        description: 'Run one job'
        type: choice
        options: [all, python, spark, onelake]
        default: all
      tests:
        description: 'pytest -k expression (runs only these tests)'
        default: ''
      full:
        description: 'Run every test instead of only the last failures'
        type: boolean
        default: false
      fuzz_seeds:
        description: 'Number of fuzz seeds (0..n-1)'
        default: '8'
      fuzz_seed:
        description: 'Replay a single fuzz seed (overrides fuzz_seeds)'
        default: ''
      run_id:
        description: 'Run whose delta_export-linux_amd64 artifact to test (default: latest CI build on main)'
        default: ''

permissions:
  contents: read
  actions: write # save the pytest cache

env:
  DELTA_EXPORT_EXTENSION_PATH: ./artifact/delta_export.duckdb_extension
  FULL: ${{ inputs.full }}
  TESTS: ${{ inputs.tests }}

jobs:
  python-tests:
    name: Python tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'python' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # From CI: this run's build. Dispatched: the run named by run_id, else the latest CI build on main
      - name: Download extension (this run)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          name: delta_export-linux_amd64
          path: ./artifact

      - name: Download extension (run_id)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id != '' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          name: delta_export-linux_amd64
          run_id: ${{ inputs.run_id }}
          path: ./artifact

      - name: Download extension (latest CI build on main)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id == '' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          name: delta_export-linux_amd64
          workflow: CI.yml
          branch: main
          workflow_conclusion: completed
          search_artifacts: true
          path: ./artifact

      - uses: actions/cache/restore@v4
        with:
          path: .pytest_cache
          key: pytest-python-${{ github.run_id }}
          restore-keys: pytest-python-

      - run: pip install duckdb==2.0.0.dev2610162032 deltalake pyarrow pytest

      # delta_scan (delta-kernel-rs) and delta-rs read every export; Spark runs in its own job
      - name: pytest
        run: |
          set -- -v -s --tb=long -m "not spark"
          if [ -n "$TESTS" ]; then set -- "$@" -k "$TESTS"; elif [ "$FULL" != "true" ]; then set -- "$@" --lf --lfnf none; fi
          pytest test/python/ "$@" || { rc=$?; [ $rc -eq 5 ] && echo "nothing failed last time: no tests to re-run (dispatch full=true for everything)" && exit 0; exit $rc; }

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .pytest_cache
          key: pytest-python-${{ github.run_id }}-${{ github.run_attempt }}

  spark-tests:
    name: Spark (Fabric Runtime 2.0)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == 'spark' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Fabric Runtime 2.0: Spark 4.1, Delta Lake 4.2, Java 21, Python 3.13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download extension (this run)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          name: delta_export-linux_amd64
          path: ./artifact

      - name: Download extension (run_id)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id != '' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          name: delta_export-linux_amd64
          run_id: ${{ inputs.run_id }}
          path: ./artifact

      - name: Download extension (latest CI build on main)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id == '' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          name: delta_export-linux_amd64
          workflow: CI.yml
          branch: main
          workflow_conclusion: completed
          search_artifacts: true
          path: ./artifact

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache/restore@v4
        with:
          path: .pytest_cache
          key: pytest-spark-${{ github.run_id }}
          restore-keys: pytest-spark-

      # delta-spark 4.2.0 pins pyspark <= 4.1.1
      # pytz: DuckDB needs it to return TIMESTAMPTZ values to Python
      - run: pip install duckdb==2.0.0.dev2610162032 pyspark==4.1.1 delta-spark==4.2.0 pyarrow pytz pytest

      # Spark + Delta Lake is the reference reader: smoke suite, edge cases, randomized workloads
      - name: pytest
        env:
          FUZZ_SEEDS: ${{ inputs.fuzz_seeds || '8' }}
          FUZZ_SEED: ${{ inputs.fuzz_seed }}
        run: |
          set -- -v -s --tb=long -m spark
          if [ -n "$TESTS" ]; then set -- "$@" -k "$TESTS"; elif [ "$FULL" != "true" ]; then set -- "$@" --lf --lfnf none; fi
          pytest test/python/ "$@" || { rc=$?; [ $rc -eq 5 ] && echo "nothing failed last time: no tests to re-run (dispatch full=true for everything)" && exit 0; exit $rc; }

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .pytest_cache
          key: pytest-spark-${{ github.run_id }}-${{ github.run_attempt }}

  onelake-tests:
    # Live OneLake round trip ending with the Fabric SQL analytics endpoint reading the exported tables. Auth is
    # GitHub OIDC only: the test exchanges the job's id-token for tokens (workload-identity federation). It uses
    # the repository's Azure identity, so CI runs it only on pushes to main, never on pull requests.
    name: OneLake + SQL endpoint
    if: ${{ (github.event_name != 'workflow_dispatch' && inputs.onelake) || (github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'onelake')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ONELAKE_WAREHOUSE: 1c52481c-0523-4a5a-bbde-fdc932bd77c2/7cb28f47-65bd-4aac-96c0-f7dd4eeb40ff
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download extension (this run)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/download-artifact@v4
        with:
          name: delta_export-linux_amd64
          path: ./artifact

      - name: Download extension (run_id)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id != '' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          name: delta_export-linux_amd64
          run_id: ${{ inputs.run_id }}
          path: ./artifact

      - name: Download extension (latest CI build on main)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id == '' }}
        uses: dawidd6/action-download-artifact@v6
        with:
          name: delta_export-linux_amd64
          workflow: CI.yml
          branch: main
          workflow_conclusion: completed
          search_artifacts: true
          path: ./artifact

      - run: pip install duckdb==2.0.0.dev2610162032 azure-identity mssql-python pytest

      - run: pytest test/python/test_onelake.py -v -s --tb=long
